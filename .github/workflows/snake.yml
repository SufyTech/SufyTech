name: Generate Animated Contribution Snake

# Regenerates the contribution snake SVG daily, on manual trigger,
# and whenever main is updated (so it never sits stale).
on:
  schedule:
    - cron: "0 0 * * *"   # Runs once a day at 00:00 UTC
  workflow_dispatch: {}    # Allows manual runs from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write   # Required to push the generated SVG to the output branch

jobs:
  build:
    name: Build and publish snake SVG
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution grid snake
        uses: Platane/snk@v3
        with:
          github_user_name: SufyTech
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish SVG to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
